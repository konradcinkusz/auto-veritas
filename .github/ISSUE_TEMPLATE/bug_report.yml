name: Bug report
description: Something behaves differently than documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Compose / Aspire / Fly.io, browser, and the offer or endpoint involved.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Strip anything sensitive — tokens, connection strings, real e-mails.
