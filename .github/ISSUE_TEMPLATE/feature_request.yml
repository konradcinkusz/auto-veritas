name: Feature request
description: A capability the product should have
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can't you (or a viewer, or the agent) do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal and alternatives
      description: What you'd build, and what you considered and rejected.
    validations:
      required: true
