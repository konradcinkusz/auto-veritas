name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore AutoVeritas.slnx
      - name: Build
        run: dotnet build AutoVeritas.slnx -c Release --no-restore
      - name: Test
        run: dotnet test AutoVeritas.slnx -c Release --no-build --logger trx --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dotnet-test-results
          path: TestResults
      - name: Format
        run: dotnet format AutoVeritas.slnx --verify-no-changes --severity error

  mechanical-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Kernel ceiling (P2 — ~800 lines, enforced mechanically)
        run: |
          lines=$(cat src/AutoVeritas.ServiceDefaults/*.cs | wc -l)
          echo "ServiceDefaults kernel: $lines lines"
          if [ "$lines" -gt 800 ]; then
            echo "::error::The shared kernel exceeds the 800-line ceiling ($lines). Move domain code out."
            exit 1
          fi
      - name: Kernel holds no domain types (P2 architecture guard)
        run: |
          if grep -rEn "CarOffer|FinancingOffer|OffersDbContext" src/AutoVeritas.ServiceDefaults/; then
            echo "::error::The shared kernel references domain types."
            exit 1
          fi
      - name: No fixed sleeps in e2e (waiting discipline)
        run: |
          if grep -rEn "waitForTimeout|setTimeout\(.*[0-9]{3,}" e2e/tests/; then
            echo "::error::Fixed sleeps are banned in e2e tests; use web-first assertions."
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Web-kit tests
        run: pnpm --filter @auto-veritas/web-kit test
      - name: Typecheck
        run: pnpm lint
      - name: Build
        run: pnpm build

  e2e-smoke:
    # The smoke tier from e2e/CHARTER.md against the compose-per-run stack:
    # postgres + the pinned authservice image + both product containers.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Generate an ephemeral RS256 dev key
        run: ./scripts/generate-jwt-key.sh
      - name: Boot the stack
        run: docker compose up --build --detach
      - name: Wait for readiness
        run: |
          for url in \
            http://localhost:8081/health/ready \
            http://localhost:8082/health/ready \
            http://localhost:3000/healthz; do
            for i in $(seq 1 60); do
              if curl -fsS "$url" >/dev/null 2>&1; then echo "$url ready"; break; fi
              if [ "$i" = 60 ]; then echo "::error::$url never became ready"; docker compose logs; exit 1; fi
              sleep 2
            done
          done
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm --filter auto-veritas-e2e exec playwright install --with-deps chromium
      - name: Run smoke suite
        env:
          BASE_URL: http://localhost:3000
          AUTH_URL: http://localhost:8081
          OFFERS_URL: http://localhost:8082
        run: pnpm --filter auto-veritas-e2e run test:smoke
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: e2e/playwright-report
      - name: Teardown
        if: always()
        run: docker compose down -v
