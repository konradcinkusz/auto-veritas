name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 4 * * 1'

# gitleaks-action's PR scan lists the PR's commits through the API and posts a
# comment when it finds a leak; the default restricted GITHUB_TOKEN carries no
# pull-request permission at all and the job dies with "Resource not accessible
# by integration" before scanning anything.
permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
