# gitleaks configuration. Extends the default rule set rather than replacing it.

[extend]
useDefault = true

[allowlist]
description = "Deliberately weak, publicly documented local-evaluation credentials"

paths = [
  # compose and the development appsettings ship weak local-only credentials on
  # purpose and say so; deployed secrets live only in the Fly secret store.
  '''docker-compose\.yml''',
  '''secrets\.env\.example''',
  '''src/AutoVeritas\.OffersService/appsettings\.Development\.json''',
]
